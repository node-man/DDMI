<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ddmi — Mission Control</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <nav>
    <a href="/" class="active">Health</a>
    <a href="/conflicts">Conflicts</a>
    <a href="/audit">Audit</a>
  </nav>

  <h1>Project Health</h1>

  <div id="health" hx-get="/api/health" hx-trigger="load" hx-swap="innerHTML">
    Loading...
  </div>

  <script>
    document.addEventListener('htmx:afterSwap', (e) => {
      if (e.detail.target.id !== 'health') return;
      const data = JSON.parse(e.detail.xhr.responseText);
      e.detail.target.innerHTML = `
        <div class="grid">
          <div class="stat"><div class="value">${data.files}</div><div class="label">Files</div></div>
          <div class="stat"><div class="value">${data.chunks}</div><div class="label">Chunks</div></div>
          <div class="stat"><div class="value">${data.relations}</div><div class="label">Relations</div></div>
          <div class="stat"><div class="value">${data.openConflicts}</div><div class="label">Open Conflicts</div></div>
          <div class="stat"><div class="value">${data.auditEvents}</div><div class="label">Audit Events</div></div>
          <div class="stat">
            <div class="value">${data.chainValid ? '✓' : '✗'}</div>
            <div class="label">Chain ${data.chainValid ? '<span class="badge valid">Valid</span>' : '<span class="badge invalid">Broken</span>'}</div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
